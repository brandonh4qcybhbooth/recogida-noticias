name: Recoger noticias

on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas, en el minuto 17 (hora UTC = hora de Canarias en invierno)
  workflow_dispatch:          # botón para lanzarla a mano

permissions:
  contents: write

concurrency:
  group: recoger
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar lo necesario
        run: pip install -r requirements.txt

      - name: Recoger
        run: python recoger.py

      - name: Guardar en el repositorio
        run: |
          git config user.name "recogida-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos
          git diff --cached --quiet && exit 0
          git commit -m "Recogida $(TZ=Atlantic/Canary date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
